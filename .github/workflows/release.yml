name: Publish image

# Pushing a tag such as v0.1.0 runs the full CI suite, then builds the multi-arch image and pushes it to
# Docker Hub and Quay. Pushing to the dev branch does the same but tags the image "dev". "Run workflow" (workflow_dispatch) does everything except the push: a dry run.

on:
  push:
    tags: ["v*.*.*"]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Namespaces default to the GitHub owner; set repository variables DOCKERHUB_NAMESPACE / QUAY_NAMESPACE if yours differ.
  DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}/lanwarden
  QUAY_IMAGE: quay.io/${{ vars.QUAY_NAMESPACE || github.repository_owner }}/lanwarden

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing (OIDC)
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Image names, tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.QUAY_IMAGE }}
          # "latest" is added automatically for stable tags only (not v1.0.0-rc1)
          # Pushes to the dev branch get the moving tag "dev" plus the sha tag; never "latest".
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Nothing is pushed unless the image passes the vulnerability scan.
      - name: Build (amd64) for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: lanwarden:scan
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lanwarden:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Vulnerability score
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lanwarden:scan
          ignore-unfixed: true
          format: json
          output: trivy.json
      - run: scripts/vuln-score.sh trivy.json

      - name: Scan report for the attestation
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lanwarden:scan
          ignore-unfixed: true
          format: cosign-vuln
          output: vuln.json

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false # Quay support for attestation manifests is not verified; enable later if wanted
          sbom: false

      # Keyless: the signature binds the image digest to this workflow run's identity (see docs/SECURITY.md to verify).
      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image and attach the scan result
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for image in "$DOCKERHUB_IMAGE" "$QUAY_IMAGE"; do
            cosign sign --yes "$image@$DIGEST"
            cosign attest --yes --type vuln --predicate vuln.json "$image@$DIGEST"
          done

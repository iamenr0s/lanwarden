name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new advisories appear without any code change
  workflow_dispatch:
  workflow_call: # the publish workflow runs the whole suite before it pushes anything

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2 ieee-data
      - run: pip install -r requirements-dev.txt
      - name: Tests (coverage floor 90%)
        run: pytest -q --cov=app --cov-report=xml --cov-fail-under=90
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false # a Codecov outage must not fail the build; the 90% floor above is the gate
      - name: Lint and security rules
        run: ruff check app tests --select F,E9,B,S,UP --ignore S101,S105,S106,S311,B008,UP017,UP042 --line-length 140
      - name: bandit (medium and above)
        run: bandit -q -r app -ll
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt
      - name: semgrep (static analysis)
        run: uvx --python 3.14 semgrep scan --config p/python --config p/owasp-top-ten --config p/typescript --config p/react --metrics=off --error --quiet app ../frontend/src
      - name: Locked dependencies install from their hashes
        run: python -m venv /tmp/locked && /tmp/locked/bin/pip install --require-hashes -r requirements.txt
      - name: API fuzzing
        run: FUZZ_EXAMPLES=100 pytest tests/fuzz_api.py -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --redact --no-banner -s /repo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build # type-checks (tsc) and bundles
      - run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: npm audit --audit-level=moderate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t lanwarden:ci .
      - name: Scan the image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lanwarden:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Vulnerability score
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lanwarden:ci
          ignore-unfixed: true
          format: json
          output: trivy.json
      - run: scripts/vuln-score.sh trivy.json
      - name: The container starts and answers its health check
        run: |
          docker run -d --name ga --network host -e LANWARDEN_PORT=18080 lanwarden:ci
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:18080/api/health && exit 0; sleep 1; done
          docker logs ga; exit 1

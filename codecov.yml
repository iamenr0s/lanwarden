coverage:
  status:
    project:
      backend:
        flags: [backend]
        target: auto
        threshold: 1%
      frontend:
        flags: [frontend]
        target: auto
        threshold: 1%
    patch:
      backend:
        flags: [backend]
        target: 80%
      frontend:
        flags: [frontend]
        target: 80%
flags:
  backend:
    paths: [backend/app]
  frontend:
    paths: [frontend/src]
comment:
  layout: "condensed_header, diff, flags, files"
